<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GY-ENGINE | Strategic Intelligence Terminal</title>
  
  <script src="https://unpkg.com/globe.gl"></script>
  
  <style>
    :root {
      --glow-cyan: #00ffcc;
      --panel-bg: rgba(6, 9, 13, 0.98);
      --text-dim: #556;
      --header-height: 40px;
    }

    body { 
      margin: 0; 
      background: #000; 
      overflow: hidden; 
      font-family: 'Courier New', Courier, monospace; 
      color: var(--glow-cyan);
    }

    /* SYSTEM HEADER */
    #sys-header {
      position: absolute; top: 0; width: 100%; height: var(--header-height);
      background: #000; border-bottom: 1px solid #1a1a1a;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; box-sizing: border-box; z-index: 100;
      font-size: 11px; letter-spacing: 1px;
    }

    .auth-status { border: 1px solid var(--glow-cyan); padding: 2px 10px; border-radius: 2px; }

    /* THE DATA TERMINAL */
    #intel-panel {
      position: absolute; top: var(--header-height); right: -500px; 
      width: 420px; height: calc(100vh - var(--header-height));
      background: var(--panel-bg); border-left: 1px solid #1a1a1a;
      z-index: 50; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,0.8);
    }

    #intel-panel.active { right: 0; border-left: 1px solid var(--glow-cyan); }

    .panel-header { background: var(--glow-cyan); color: #000; padding: 12px 20px; font-weight: bold; font-size: 14px; text-transform: uppercase; }
    .panel-body { padding: 30px; }

    .label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; margin-top: 30px; display: block; border-bottom: 1px solid #1a1a1a; padding-bottom: 5px; }
    
    .whisper-vessel { 
      margin-top: 15px; font-size: 14px; line-height: 1.6; color: #fff;
      border-left: 2px solid var(--glow-cyan); padding-left: 15px; min-height: 60px;
    }

    .market-vessel { font-size: 42px; font-weight: bold; margin-top: 10px; color: var(--glow-cyan); }
    .unit { font-size: 14px; color: var(--text-dim); margin-left: 5px; }

    /* THE GLOBE CONTAINER - DO NOT CHANGE THIS ID */
    #globe-viz { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  </style>
</head>
<body>

  <nav id="sys-header">
    <div><span style="color:#ff3333; margin-right:5px; animation: blink 1s infinite;">●</span> SYSTEM: LIVE_FEED // GY_ENGINE_V2</div>
    <div class="auth-status">ARCHITECT AUTHENTICATED: SANJEEV JHA</div>
  </nav>

  <aside id="intel-panel">
    <div class="panel-header" id="country-name">DATA_NODE: STANDBY</div>
    <div class="panel-body">
      
      <span class="label">Geopolitical Analysis [Gemini Pro AI]</span>
      <div id="whisper-output" class="whisper-vessel">Initiating regional satellite uplink...</div>

      <span class="label">Global Market Pulse [Finnhub]</span>
      <div class="market-vessel">
        <span id="price-output">--</span><span class="unit">USD</span>
      </div>
      
    </div>
  </aside>

  <div id="globe-viz"></div>

  <script>
    // 1. Target the DIV and build the globe
    const panel = document.getElementById('intel-panel');
    const globe = Globe()(document.getElementById('globe-viz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('var(--glow-cyan)')
      .atmosphereDaylightAlpha(0.1);

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.6;

    // 2. The Data Fetcher (Talking to your Vercel /api folder)
    async function fetchSystemData(country) {
      document.getElementById('whisper-output').innerText = "Analyzing current geopolitical shifts...";
      document.getElementById('price-output').innerText = "---";

      try {
        const res = await fetch(`/api/terminal-data?country=${country}`);
        
        if (!res.ok) throw new Error("API Offline");
        
        const data = await res.json();
        
        document.getElementById('whisper-output').innerText = data.whisper || "Signal encrypted. Check Vercel logs.";
        document.getElementById('price-output').innerText = data.price || "0.00";
      } catch (err) {
        document.getElementById('whisper-output').innerText = "CONNECTION_ERROR: Ensure project is deployed to Vercel with valid API keys.";
        document.getElementById('price-output').innerText = "ERR";
      }
    }

    // 3. Load the Map Borders
    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(data => {
        globe.polygonsData(data.features)
          .polygonStrokeColor(() => 'var(--glow-cyan)')
          .polygonCapColor(() => 'rgba(0, 255, 204, 0.01)') // 99% transparent so we can click
          .onPolygonClick(({ properties: p }) => {
            document.getElementById('country-name').innerText = `DATA_NODE: ${p.ADMIN.toUpperCase()}`;
            panel.classList.add('active');
            fetchSystemData(p.ADMIN);
          })
          .onPolygonHover(hoverD => globe.polygonCapColor(d => d === hoverD ? 'rgba(0, 255, 204, 0.2)' : 'rgba(0, 255, 204, 0.01)'));
      });

    // 4. Handle Window Resizing
    window.addEventListener('resize', () => {
      globe.width(window.innerWidth);
      globe.height(window.innerHeight);
    });
  </script>

  <style>
    @keyframes blink { 0% {opacity:1;} 50% {opacity:0.2;} 100% {opacity:1;} }
  </style>
</body>
</html>
