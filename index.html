<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MACRO-NODE TERMINAL // SANJEEV JHA</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #05070a; --panel: #0a0d11; --border: #1a1e23; --red: #ff3333; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
    
    #header { position: absolute; top: 0; width: 100%; height: 50px; background: #000; border-bottom: 1px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; box-sizing: border-box; }

    #sidebar { position: absolute; top: 50px; right: -850px; width: 800px; height: calc(100vh - 50px); background: var(--panel); border-left: 2px solid var(--neon); z-index: 50; transition: 0.4s ease; overflow-y: auto; padding: 25px; box-sizing: border-box; }
    #sidebar.active { right: 0; box-shadow: -20px 0 50px rgba(0, 255, 204, 0.1); }

    .country-header { display: flex; align-items: center; gap: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
    .country-name { color: var(--red); font-size: 32px; font-weight: bold; text-transform: uppercase; }

    .label { color: #556; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-top: 25px; display: block; border-left: 3px solid var(--neon); padding-left: 10px; }
    
    .news-card { font-size: 12px; padding: 12px; background: #161b22; margin-top: 8px; border-left: 2px solid var(--border); line-height: 1.4; }

    /* REAL-TIME DATA CARD (Replaces the screenshot) */
    .telemetry-card { background: #000; border: 1px solid var(--border); padding: 25px; margin-top: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
    .price-main { font-size: 56px; font-weight: bold; color: #fff; letter-spacing: -2px; }
    .change-indicator { font-size: 24px; font-weight: bold; padding-bottom: 8px; }

    .asset-table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 11px; }
    .asset-table th { text-align: left; color: #556; padding: 10px; border-bottom: 1px solid var(--border); }
    .asset-table td { padding: 12px 10px; border-bottom: 1px solid #161b22; }
    .cat-tag { color: var(--neon); font-weight: bold; font-size: 9px; }
  </style>
</head>
<body>

<header id="header">
  <div style="font-weight: bold; letter-spacing: 2px; color: var(--neon);">MACRO-NODE TERMINAL</div>
  <div style="font-size:12px; color:#8b949e;">SYSTEM ARCHITECT: <b style="color:var(--neon)">SANJEEV JHA</b></div>
</header>

<aside id="sidebar">
  <div class="country-header">
    <img id="flag" src="" style="width: 60px; height: auto; border: 1px solid var(--border);">
    <span id="c-name" class="country-name">STANDBY</span>
  </div>

  <div id="data-ui">
    <span class="label">Strategic Regional Intelligence (Business/Finance)</span>
    <div id="news-out"></div>

    <span class="label">Benchmark Data: <span id="bench-label" style="color:var(--neon)">--</span></span>
    <div class="telemetry-card">
      <div>
        <div id="ticker-label" style="color:#556; font-size:12px; margin-bottom: 5px;">--</div>
        <div id="price" class="price-main">$0.00</div>
      </div>
      <div id="change" class="change-indicator">--</div>
    </div>

    <span class="label">Institutional Multi-Asset Portfolio</span>
    <table class="asset-table">
      <thead>
        <tr><th>CATEGORY</th><th>ASSET IDENTIFIER</th><th>INSTRUMENT</th><th>RISK</th></tr>
      </thead>
      <tbody id="asset-list"></tbody>
    </table>
  </div>
</aside>

<div id="globe-viz"></div>

<script>
  const sidebar = document.getElementById('sidebar');
  const globe = Globe()(document.getElementById('globe-viz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#00ffcc').showAtmosphere(true);

  async function loadTerminal(country) {
    sidebar.classList.add('active');
    document.getElementById('c-name').innerText = country;

    try {
      const res = await fetch(`/api/terminal-data?country=${country}`);
      const data = await res.json();

      document.getElementById('flag').src = data.flag;
      document.getElementById('news-out').innerHTML = data.news.map(n => `<div class="news-card">${n}</div>`).join('');
      document.getElementById('bench-label').innerText = data.bench;
      document.getElementById('ticker-label').innerText = data.ticker;
      document.getElementById('price').innerText = "$" + data.price;
      
      const change = parseFloat(data.change);
      const indicator = document.getElementById('change');
      indicator.style.color = change >= 0 ? '#00ff00' : '#ff3333';
      indicator.innerHTML = (change >= 0 ? "▲ " : "▼ ") + Math.abs(change) + "%";

      document.getElementById('asset-list').innerHTML = data.portfolio.map(p => `
        <tr>
          <td class="cat-tag">${p.cat}</td>
          <td style="font-weight:bold;">${p.asset}</td>
          <td style="color:#8b949e">${p.type}</td>
          <td style="color:${p.risk === 'HIGH' ? 'var(--red)' : '#fff'}">${p.risk}</td>
        </tr>
      `).join('');

    } catch (err) { console.log("DATA_FETCH_ERROR"); }
  }

  fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json()).then(data => {
      globe.polygonsData(data.features)
        .polygonStrokeColor(() => '#00ffcc')
        .polygonCapColor(() => 'rgba(0,255,204,0.02)')
        .onPolygonClick(({ properties: p }) => loadTerminal(p.ADMIN));
    });
</script>
</body>
</html>
