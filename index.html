<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GY-ENGINE // MACRO TERMINAL</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #05070a; --panel: #0c0f13; --border: #1a1e23; --dim: #556; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }

    #header {
      position: absolute; top: 0; width: 100%; height: 45px; background: var(--bg);
      border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between;
      align-items: center; padding: 0 25px; box-sizing: border-box; z-index: 100;
    }

    #sidebar {
      position: absolute; top: 45px; right: -550px; width: 500px; height: calc(100vh - 45px);
      background: var(--panel); border-left: 1px solid var(--neon); z-index: 50;
      transition: 0.4s ease-in-out; display: flex; flex-direction: column; overflow-y: auto;
    }
    #sidebar.active { right: 0; }

    .p-head { background: var(--neon); color: #000; padding: 12px 25px; font-weight: bold; font-size: 14px; }
    .p-body { padding: 30px; }
    .label { color: var(--dim); font-size: 10px; text-transform: uppercase; margin-top: 25px; border-bottom: 1px solid var(--border); padding-bottom: 5px; display: block; }
    .news-box { margin-top: 15px; font-size: 13px; line-height: 1.6; color: #fff; background: rgba(0,255,204,0.03); border-left: 3px solid var(--neon); padding: 15px; white-space: pre-wrap; }

    .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .card { background: #05070a; border: 1px solid var(--border); padding: 15px; }
    .val { font-size: 24px; font-weight: bold; color: var(--neon); }
    .buy-signal { background: #00ffcc; color: #000; padding: 12px; margin-top: 20px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <header id="header">
    <div style="font-size:13px"><span style="color:#ff3333">●</span> LIVE_BLOOMBERG_FEED</div>
    <div style="font-size:11px; color:var(--dim);">ARCHITECT: <b style="color:var(--neon)">SANJEEV JHA</b></div>
  </header>

  <aside id="sidebar">
    <div class="p-head" id="node-name">SYSTEM STANDBY</div>
    <div class="p-body">
      <span class="label">Latest News & Strategic Intel</span>
      <div id="news-out" class="news-box">Select a country to initiate real-time downlink...</div>

      <span class="label">Market Data (<span id="symbol-out">--</span>)</span>
      <div class="market-grid">
        <div class="card"><div style="font-size:9px; color:var(--dim)">SPOT PRICE</div><div id="price-out" class="val">--</div></div>
        <div class="card"><div style="font-size:9px; color:var(--dim)">24H DELTA</div><div id="trend-out" class="val">--</div></div>
      </div>

      <div id="signal-out" class="buy-signal">WAITING FOR DATA</div>
    </div>
  </aside>

  <div id="globe-viz"></div>

  <script>
    const side = document.getElementById('sidebar');
    const world = Globe()(document.getElementById('globe-viz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .atmosphereColor('#00ffcc').showAtmosphere(true);

    async function loadData(country) {
      document.getElementById('news-out').innerText = "Establishing secure connection...";
      try {
        const res = await fetch(`/api/terminal-data?country=${country}`);
        const data = await res.json();
        
        document.getElementById('news-out').innerText = data.intel;
        document.getElementById('symbol-out').innerText = data.symbol;
        document.getElementById('price-out').innerText = `$${data.price}`;
        document.getElementById('trend-out').innerText = `${data.change}%`;
        document.getElementById('signal-out').innerText = data.action;
      } catch (err) {
        document.getElementById('news-out').innerText = "FEED_ERROR: CHECK VERCEL LOGS";
      }
    }

    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json()).then(data => {
        world.polygonsData(data.features)
          .polygonStrokeColor(() => '#00ffcc')
          .polygonCapColor(() => 'rgba(0,255,204,0.01)')
          .onPolygonClick(({ properties: p }) => {
            document.getElementById('node-name').innerText = `REGION: ${p.ADMIN}`;
            side.classList.add('active');
            loadData(p.ADMIN);
          });
      });
  </script>
</body>
</html>
