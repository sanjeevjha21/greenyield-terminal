<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GY-ENGINE // STRATEGIC COMMAND</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #05070a; --panel: #0d1117; --border: #30363d; --red: #ff4444; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    
    #header { position: absolute; top: 0; width: 100%; height: 50px; background: #000; border-bottom: 1px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; box-sizing: border-box; }

    #sidebar { position: absolute; top: 50px; right: -650px; width: 600px; height: calc(100vh - 50px); background: var(--panel); border-left: 2px solid var(--neon); z-index: 50; transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); overflow-y: auto; padding: 25px; box-sizing: border-box; }
    #sidebar.active { right: 0; box-shadow: -10px 0 30px rgba(0, 255, 204, 0.2); }

    .tag { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; border-left: 3px solid var(--neon); padding-left: 10px; }
    
    /* NEWS & TREND GRID */
    .news-item { font-size: 13px; padding: 12px; background: #161b22; border-radius: 4px; margin-bottom: 8px; border-left: 2px solid var(--border); }
    .trend-item { font-size: 13px; color: var(--neon); font-weight: bold; margin-bottom: 5px; }

    /* INVESTMENT PANEL */
    .buy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .buy-card { background: #000; border: 1px solid var(--neon); padding: 15px; border-radius: 4px; text-align: center; }
    .buy-card h4 { margin: 0; font-size: 11px; color: #8b949e; }
    .buy-card div { font-size: 18px; font-weight: bold; margin-top: 5px; }

    .risk-tag { display: inline-block; padding: 2px 8px; font-size: 10px; border-radius: 10px; background: var(--red); margin-top: 5px; }
    
    .price-big { font-size: 42px; font-weight: bold; color: var(--neon); letter-spacing: -1px; }
  </style>
</head>
<body>

<header id="header">
  <div style="font-weight: bold; letter-spacing: 2px;"><span style="color:var(--red)">●</span> CORE: DATA_UPLINK</div>
  <div style="font-size:12px; color:#8b949e;">ARCHITECT: <span style="color:var(--neon)">SANJEEV JHA</span></div>
</header>

<aside id="sidebar">
  <div id="region-title" style="font-size:24px; font-weight:bold; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">STANDBY</div>

  <span class="tag">Regional Business News</span>
  <div id="news-container"></div>

  <span class="tag">Macro Economics & Trends</span>
  <div id="trend-container" style="background:#161b22; padding:15px; margin-bottom:20px;"></div>

  <span class="tag">Strategic Buy Options & Stocks</span>
  <div class="buy-grid">
    <div class="buy-card"><h4>PRIMARY TICKER</h4><div id="t-1">--</div></div>
    <div class="buy-card"><h4>SECONDARY PICK</h4><div id="t-2">--</div></div>
    <div class="buy-card"><h4>FUTURES/OPTIONS</h4><div id="t-opt" style="font-size:14px">--</div></div>
    <div class="buy-card"><h4>RISK PROFILE</h4><div id="t-risk">--</div></div>
  </div>

  <span class="tag">Benchmark Performance</span>
  <div id="price-out" class="price-big">--</div>
  <div id="change-out" style="font-size:18px; font-weight:bold;">--</div>
</aside>

<div id="globe-viz"></div>

<script>
  const sidebar = document.getElementById('sidebar');
  const globe = Globe()(document.getElementById('globe-viz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#00ffcc').showAtmosphere(true);

  async function updateTerminal(country) {
    document.getElementById('region-title').innerText = "LINKING: " + country.toUpperCase();
    try {
      const res = await fetch(`/api/terminal-data?country=${country}`);
      const data = await res.json();

      // News list
      document.getElementById('news-container').innerHTML = data.news.map(n => `<div class="news-item">${n}</div>`).join('');
      
      // Trends list
      document.getElementById('trend-container').innerHTML = data.trends.map(t => `<div class="trend-item">${t}</div>`).join('');

      // Buy signals
      document.getElementById('t-1').innerText = data.ticker;
      document.getElementById('t-2').innerText = data.investment.secondary;
      document.getElementById('t-opt').innerText = data.investment.derivatives;
      document.getElementById('t-risk').innerHTML = data.investment.risk + `<br><span class="risk-tag">STRICT MONITORING</span>`;

      // Market
      document.getElementById('price-out').innerText = "$" + data.price;
      const trendColor = parseFloat(data.change) >= 0 ? '#00ff00' : '#ff4444';
      document.getElementById('change-out').style.color = trendColor;
      document.getElementById('change-out').innerText = (parseFloat(data.change) >= 0 ? "▲ " : "▼ ") + Math.abs(data.change) + "%";

    } catch (err) {
      console.log("Error fetching data");
    }
  }

  fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json()).then(data => {
      globe.polygonsData(data.features)
        .polygonStrokeColor(() => '#00ffcc')
        .polygonCapColor(() => 'rgba(0,255,204,0.02)')
        .onPolygonClick(({ properties: p }) => {
          sidebar.classList.add('active');
          updateTerminal(p.ADMIN);
        });
    });
</script>
</body>
</html>
