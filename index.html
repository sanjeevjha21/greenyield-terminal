<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MACRO-NODE TERMINAL</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --red: #ff3333; --glass: rgba(10, 15, 20, 0.8); }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
    
    #header { position: absolute; top: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; z-index: 100; box-sizing: border-box; }

    /* NARROW & TRANSPARENT SIDEBAR */
    #sidebar { position: absolute; top: 50px; right: -500px; width: 450px; height: calc(100vh - 50px); background: var(--glass); backdrop-filter: blur(15px); border-left: 1px solid var(--neon); z-index: 50; transition: 0.5s cubic-bezier(0.1, 0.8, 0.2, 1); overflow-y: auto; padding: 25px; box-sizing: border-box; }
    #sidebar.active { right: 0; }

    .header-group { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .country-main { color: var(--red); font-size: 24px; font-weight: bold; text-transform: uppercase; }
    .iso-sub { color: #556; font-size: 14px; }

    .label { color: #444; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; margin-top: 25px; display: block; border-left: 2px solid var(--neon); padding-left: 8px; }
    .news-box { font-size: 11px; padding: 12px; background: rgba(255,255,255,0.03); margin-top: 8px; border: 1px solid rgba(255,255,255,0.05); line-height: 1.4; }

    .price-card { background: rgba(0,0,0,0.4); border: 1px solid #222; padding: 20px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
    .price-val { font-size: 38px; font-weight: bold; letter-spacing: -1px; }

    .asset-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a1e23; font-size: 10px; }
  </style>
</head>
<body>

<header id="header">
  <div style="color: var(--neon); font-weight: bold; font-size: 14px;">MACRO-NODE TERMINAL</div>
  <div style="font-size: 10px; color: #556;">ARCHITECT: SANJEEV JHA</div>
</header>

<aside id="sidebar">
  <div class="header-group">
    <img id="flag-img" src="" style="width: 45px; height: auto; display: none; border: 1px solid #333;">
    <div>
      <span id="c-full" class="country-main">SELECT</span>
      <span id="c-iso" class="iso-sub"></span>
    </div>
  </div>

  <span class="label">Geopolitical Intel Feed</span>
  <div id="news-out"></div>

  <span class="label">Benchmark: <span id="bench" style="color:var(--neon)">--</span></span>
  <div class="price-card">
    <div><div id="tick" style="color:#556; font-size:10px;">--</div><div id="price" class="price-val">$0.00</div></div>
    <div id="change" style="font-size:18px; font-weight:bold;">--</div>
  </div>

  <span class="label">Strategic Portfolio Model</span>
  <div id="portfolio-out" style="margin-top: 10px;"></div>
</aside>

<div id="globe-viz"></div>

<script>
  const sidebar = document.getElementById('sidebar');
  const globe = Globe()(document.getElementById('globe-viz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#00ffcc').showAtmosphere(true);

  async function updateTerminal(country) {
    sidebar.classList.add('active');
    document.getElementById('c-full').innerText = country;

    const res = await fetch(`/api/terminal-data?country=${country}`);
    const data = await res.json();

    const fImg = document.getElementById('flag-img');
    if (data.flag) {
      fImg.src = data.flag;
      fImg.style.display = 'block';
      document.getElementById('c-iso').innerText = `[${data.iso}]`;
    } else {
      fImg.style.display = 'none';
      document.getElementById('c-iso').innerText = "";
    }

    document.getElementById('news-out').innerHTML = data.news.map(n => `<div class="news-box">${n}</div>`).join('');
    document.getElementById('bench').innerText = data.bench;
    document.getElementById('tick').innerText = data.ticker;
    document.getElementById('price').innerText = "$" + data.price;
    
    const change = parseFloat(data.change);
    const cDiv = document.getElementById('change');
    cDiv.style.color = change >= 0 ? '#00ff00' : '#ff3333';
    cDiv.innerHTML = (change >= 0 ? "▲ " : "▼ ") + Math.abs(change) + "%";

    document.getElementById('portfolio-out').innerHTML = data.portfolio.map(p => `
      <div class="asset-row">
        <span style="color:var(--neon)">${p.cat}</span>
        <span>${p.asset}</span>
        <span style="color:#556">${p.type}</span>
      </div>
    `).join('');
  }

  fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json()).then(data => {
      globe.polygonsData(data.features)
        .polygonStrokeColor(() => '#00ffcc')
        .polygonCapColor(() => 'rgba(0,255,204,0.02)')
        .onPolygonClick(({ properties: p }) => updateTerminal(p.ADMIN));
    });
</script>
</body>
</html>
