<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MACRO-NODE TERMINAL // SANJEEV JHA</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --red: #ff3333; --glass: rgba(10, 14, 18, 0.85); --border: rgba(48, 54, 61, 0.5); }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
    
    #header { position: absolute; top: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; box-sizing: border-box; }

    /* DYNAMIC GLOBE SHIFT CSS */
    #globe-viz { transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.2, 1); }
    .globe-shifted { transform: translateX(-15vw); } /* Slides globe to the left */

    /* WIDER, CLEANER SIDEBAR */
    #sidebar { position: absolute; top: 50px; right: -600px; width: 550px; height: calc(100vh - 50px); background: var(--glass); backdrop-filter: blur(15px); border-left: 1px solid var(--neon); z-index: 50; transition: 0.6s cubic-bezier(0.1, 0.8, 0.2, 1); overflow-y: auto; padding: 25px; box-sizing: border-box; }
    #sidebar.active { right: 0; box-shadow: -20px 0 60px rgba(0, 255, 204, 0.1); }

    .header-group { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .country-main { color: var(--red); font-size: 28px; font-weight: bold; text-transform: uppercase; }
    
    .label { color: #667; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-top: 20px; display: block; border-left: 2px solid var(--neon); padding-left: 10px; }
    .news-box { font-size: 16px; padding: 12px; background: rgba(255,255,255,0.03); margin-top: 8px; border-left: 2px solid var(--border); line-height: 1.5; color: #e6edf3; }

    .price-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 20px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
    .price-val { font-size: 42px; font-weight: bold; letter-spacing: -1px; }

    /* HIGH VISIBILITY TABLE */
    .strat-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 16px; text-align: left; }
    .strat-table th { color: #556; padding: 10px; border-bottom: 1px solid var(--border); font-size: 9px; letter-spacing: 1px; }
    .strat-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .esg-row td { color: #a3ffcc; } /* Subtle green highlight for ESG */

    /* ARCHITECT NAME STYLING */
    .architect-name { font-size: 12px; color: var(--red); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,51,51,0.6); }
  </style>
</head>
<body>

<header id="header">
  <div style="color: var(--neon); font-weight: bold; font-size: 14px; letter-spacing: 2px;">MACRO-NODE TERMINAL</div>
  <div class="architect-name">ARCHITECT: SANJEEV JHA</div>
</header>

<aside id="sidebar">
  <div class="header-group">
    <img id="flag-img" src="" style="width: 50px; height: auto; display: none; border: 1px solid #333;">
    <div>
      <span id="c-full" class="country-main">STANDBY</span>
      <span id="c-iso" style="color:#556; font-size:14px; margin-left: 8px;"></span>
    </div>
  </div>

  <span class="label">Geopolitical & Economic Feed</span>
  <div id="news-out"></div>

  <span class="label">Benchmark: <span id="bench" style="color:var(--neon)">--</span></span>
  <div class="price-card">
    <div><div id="tick" style="color:#556; font-size:11px;">--</div><div id="price" class="price-val">$0.00</div></div>
    <div id="change" style="font-size:22px; font-weight:bold;">--</div>
  </div>

  <span class="label">10-Point Institutional Portfolio</span>
  <table class="strat-table">
    <thead>
      <tr><th>CAT</th><th>ASSET</th><th>INST</th><th>RISK</th></tr>
    </thead>
    <tbody id="portfolio-list"></tbody>
  </table>
</aside>

<div id="globe-viz"></div>

<script>
  const sidebar = document.getElementById('sidebar');
  const globeViz = document.getElementById('globe-viz');
  const globe = Globe()(globeViz)
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#00ffcc').showAtmosphere(true);

  async function updateTerminal(country) {
    // Slides panel in AND slides globe to the left simultaneously
    sidebar.classList.add('active');
    globeViz.classList.add('globe-shifted');
    
    document.getElementById('c-full').innerText = country;

    try {
      const res = await fetch(`/api/terminal-data?country=${country}`);
      const data = await res.json();

      const fImg = document.getElementById('flag-img');
      if (data.flag) {
        fImg.src = data.flag; fImg.style.display = 'block';
        document.getElementById('c-iso').innerText = `[${data.iso}]`;
      } else {
        fImg.style.display = 'none';
        document.getElementById('c-iso').innerText = "";
      }

      document.getElementById('news-out').innerHTML = data.news.map(n => `<div class="news-box">» ${n}</div>`).join('');
      document.getElementById('bench').innerText = data.bench;
      document.getElementById('tick').innerText = data.ticker;
      document.getElementById('price').innerText = "$" + data.price;
      
      const change = parseFloat(data.change);
      const cDiv = document.getElementById('change');
      cDiv.style.color = change >= 0 ? '#00ff00' : '#ff3333';
      cDiv.innerHTML = (change >= 0 ? "▲ " : "▼ ") + Math.abs(change) + "%";

      document.getElementById('portfolio-list').innerHTML = data.portfolio.map((p, index) => {
        const isESG = index >= 5 ? 'class="esg-row"' : '';
        return `
        <tr ${isESG}>
          <td style="color:var(--neon); font-weight:bold; font-size:10px;">${p.cat}</td>
          <td style="font-weight:bold;">${p.asset}</td>
          <td style="color:#8b949e">${p.inst}</td>
          <td style="color:${p.risk === 'HIGH' ? 'var(--red)' : (p.risk === 'LOW' ? '#00ff00' : '#fff')}">${p.risk}</td>
        </tr>
      `}).join('');
    } catch (err) { console.error("OFFLINE"); }
  }

  fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json()).then(data => {
      globe.polygonsData(data.features)
        .polygonStrokeColor(() => '#00ffcc')
        .polygonCapColor(() => 'rgba(0,255,204,0.02)')
        .onPolygonClick(({ properties: p }) => updateTerminal(p.ADMIN));
    });
</script>
</body>
</html>
