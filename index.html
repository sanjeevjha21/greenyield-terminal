<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GY-ENGINE // MACRO COMMAND</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #05070a; --panel: #0a0d11; --border: #1a1e23; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
    
    #header { position: absolute; top: 0; width: 100%; height: 45px; background: var(--bg); border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; z-index: 100; box-sizing: border-box; }
    
    /* WIDER PANEL FOR TOP 5 LISTS */
    #sidebar { position: absolute; top: 45px; right: -650px; width: 600px; height: calc(100vh - 45px); background: var(--panel); border-left: 1px solid var(--neon); z-index: 50; transition: 0.4s ease; overflow-y: auto; }
    #sidebar.active { right: 0; }

    .p-head { background: var(--neon); color: #000; padding: 12px 25px; font-weight: bold; text-transform: uppercase; }
    .p-body { padding: 30px; }
    
    .label { color: #556; font-size: 10px; text-transform: uppercase; margin-top: 30px; border-bottom: 1px solid #1a1e23; display: block; }
    .report-vessel { margin-top: 15px; font-size: 13px; line-height: 1.8; color: #fff; border-left: 3px solid var(--neon); padding-left: 15px; white-space: pre-wrap; background: rgba(0,255,204,0.02); padding: 20px; }

    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: #000; border: 1px solid #1a1e23; padding: 15px; }
    .val { font-size: 28px; font-weight: bold; color: var(--neon); }
  </style>
</head>
<body>

  <header id="header">
    <div style="font-size:12px"><span style="color:#ff3333">●</span> MACRO_UPLINK: ACTIVE</div>
    <div style="font-size:11px; color:#556;">ARCHITECT: <b style="color:var(--neon)">SANJEEV JHA</b></div>
  </header>

  <aside id="sidebar">
    <div class="p-head" id="node-id">SYSTEM STANDBY</div>
    <div class="p-body">
      <span class="label">Top 5 News / Trends / Investments</span>
      <div id="report-out" class="report-vessel">Select region to trigger deep-scan...</div>

      <span class="label">Market Benchmark: <span id="symbol-out">--</span></span>
      <div class="stat-row">
        <div class="card">
          <div style="font-size:9px; color:#556">SPOT VALUE (USD)</div>
          <div id="price-out" class="val">--</div>
        </div>
        <div class="card">
          <div style="font-size:9px; color:#556">24H PERFORMANCE</div>
          <div id="trend-out" class="val">--</div>
        </div>
      </div>
    </div>
  </aside>

  <div id="globe-viz"></div>

  <script>
    const side = document.getElementById('sidebar');
    const globe = Globe()(document.getElementById('globe-viz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .atmosphereColor('#00ffcc').showAtmosphere(true);

    async function loadStrategicIntel(country) {
      document.getElementById('report-out').innerText = "GENERATING STRATEGIC REPORT... PLEASE WAIT.";
      try {
        const res = await fetch(`/api/terminal-data?country=${country}`);
        const data = await res.json();
        
        document.getElementById('report-out').innerText = data.report;
        document.getElementById('price-out').innerText = `$${data.price}`;
        document.getElementById('symbol-out').innerText = data.primaryTicker;
        
        const trendColor = data.change >= 0 ? '#00ff00' : '#ff3333';
        document.getElementById('trend-out').style.color = trendColor;
        document.getElementById('trend-out').innerText = `${data.change}%`;
      } catch (err) {
        document.getElementById('report-out').innerText = "CONNECTION_ERROR: Check Vercel Key Settings.";
      }
    }

    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json()).then(data => {
        globe.polygonsData(data.features)
          .polygonStrokeColor(() => '#00ffcc')
          .polygonCapColor(() => 'rgba(0,255,204,0.01)')
          .onPolygonClick(({ properties: p }) => {
            document.getElementById('node-id').innerText = `REGION_NODE: ${p.ADMIN.toUpperCase()}`;
            side.classList.add('active');
            loadStrategicIntel(p.ADMIN);
          });
      });
  </script>
</body>
</html>
