<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GY-ENGINE // MACRO TERMINAL // SANJEEV JHA</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #05070a; --panel: #0c0f13; --border: #1a1e23; --dim: #556; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: #fff; }

    #header-bar {
      position: absolute; top: 0; width: 100%; height: 45px; background: var(--bg);
      border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between;
      align-items: center; padding: 0 25px; box-sizing: border-box; z-index: 100; font-size: 13px;
    }

    #terminal-sidebar {
      position: absolute; top: 45px; right: -500px; width: 480px; height: calc(100vh - 45px);
      background: var(--panel); border-left: 1px solid var(--neon); z-index: 50;
      transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); display: flex; flex-direction: column;
    }
    #terminal-sidebar.active { right: 0; }

    .p-header { background: var(--neon); color: #000; padding: 12px 25px; font-weight: bold; text-transform: uppercase; }
    .p-body { padding: 30px; }
    .label { color: var(--dim); font-size: 10px; text-transform: uppercase; margin-top: 30px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .whisper { margin-top: 15px; font-size: 14px; line-height: 1.7; color: #fff; background: rgba(0, 255, 204, 0.03); border-left: 3px solid var(--neon); padding: 15px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .card { background: #05070a; border: 1px solid var(--border); padding: 15px; }
    .card-val { font-size: 24px; font-weight: bold; color: var(--neon); }
    .up { color: #00ff00; } .down { color: #ff3333; }
  </style>
</head>
<body>

  <header id="header-bar">
    <div><span style="color:#ff3333">●</span> SYSTEM: GY_ENGINE_ACTIVE</div>
    <div style="font-size:11px; color:var(--dim);">SYSTEM ARCHITECT: <b style="color:var(--neon)">SANJEEV JHA</b></div>
  </header>

  <aside id="terminal-sidebar">
    <div class="p-header" id="node-title">TERMINAL: STANDBY</div>
    <div class="p-body">
      <span class="label">Strategic Intelligence Uplink</span>
      <div id="whisper-out" class="whisper">Initiating regional scan...</div>

      <span class="label">Market Delta Tracking (<span id="symbol-out">--</span>)</span>
      <div class="grid">
        <div class="card">
          <div style="font-size:9px; color:var(--dim)">SPOT PRICE</div>
          <div id="price-out" class="card-val">--</div>
        </div>
        <div class="card">
          <div style="font-size:9px; color:var(--dim)">24H VOLATILITY</div>
          <div id="trend-out" class="card-val">--</div>
        </div>
      </div>
    </div>
  </aside>

  <div id="globe-viz"></div>

  <script>
    const panel = document.getElementById('terminal-sidebar');
    const world = Globe()(document.getElementById('globe-viz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .atmosphereColor('#00ffcc').showAtmosphere(true);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    async function fetchIntel(country) {
      document.getElementById('whisper-out').innerText = "Processing encrypted data stream...";
      try {
        const res = await fetch(`/api/terminal-data?country=${country}`);
        const data = await res.json();
        
        document.getElementById('whisper-out').innerText = data.whisper;
        document.getElementById('symbol-out').innerText = data.symbol;
        document.getElementById('price-out').innerText = `$${data.price}`;
        
        const change = data.change;
        const trendIcon = change >= 0 ? "▲" : "▼";
        document.getElementById('trend-out').innerHTML = `<span class="${change >= 0 ? 'up' : 'down'}">${trendIcon} ${Math.abs(change)}%</span>`;
      } catch (err) {
        document.getElementById('whisper-out').innerText = "CONNECTION_ERROR: UPLINK_FAILED";
      }
    }

    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json()).then(data => {
        world.polygonsData(data.features)
          .polygonStrokeColor(() => '#00ffcc')
          .polygonCapColor(() => 'rgba(0, 255, 204, 0.01)')
          .onPolygonClick(({ properties: p }) => {
            document.getElementById('node-title').innerText = `DATA_NODE: ${p.ADMIN}`;
            panel.classList.add('active');
            fetchIntel(p.ADMIN);
          });
      });
  </script>
</body>
</html>
