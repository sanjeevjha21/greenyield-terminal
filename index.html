<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MACRO-NODE TERMINAL // SANJEEV JHA</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #05070a; --panel: #0d1117; --border: #30363d; --red: #ff4444; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
    
    #header { position: absolute; top: 0; width: 100%; height: 50px; background: #000; border-bottom: 1px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; box-sizing: border-box; }
    #sidebar { position: absolute; top: 50px; right: -820px; width: 800px; height: calc(100vh - 50px); background: var(--panel); border-left: 2px solid var(--neon); z-index: 50; transition: 0.4s ease; overflow-y: auto; padding: 25px; box-sizing: border-box; }
    #sidebar.active { right: 0; }

    .flex-head { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
    .country-red { color: var(--red); font-weight: bold; font-size: 32px; text-transform: uppercase; }
    
    .label { color: #556; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-top: 25px; display: block; border-left: 3px solid var(--neon); padding-left: 10px; }
    .news-card { font-size: 11px; padding: 10px; background: #161b22; margin-top: 6px; border-left: 2px solid var(--border); }

    /* STRATEGIC TABLE */
    .strat-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 11px; text-align: left; }
    .strat-table th { color: #556; padding: 10px; border-bottom: 1px solid var(--border); font-size: 9px; }
    .strat-table td { padding: 12px 10px; border-bottom: 1px solid #161b22; }

    .price-box { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 20px; margin-top: 15px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<header id="header">
  <div style="font-weight: bold; letter-spacing: 2px; color: var(--neon);">MACRO-NODE TERMINAL</div>
  <div style="font-size:11px; color:#556;">ARCHITECT: <b style="color:var(--neon)">SANJEEV JHA</b></div>
</header>

<aside id="sidebar">
  <div class="flex-head">
    <img id="flag" src="" style="width: 60px; height: auto; border: 1px solid var(--border);">
    <span id="country-name" class="country-red">STANDBY</span>
  </div>

  <div id="loader" style="display:none; color:var(--neon); animation: blink 1s infinite;">INTERCEPTING REGIONAL INTELLIGENCE...</div>

  <div id="data-ui">
    <span class="label">Top 5 Regional Business Bulletins</span>
    <div id="news-out"></div>

    <span class="label">Benchmark Performance: <span id="asset-label" style="color:var(--neon)">--</span></span>
    <div class="price-box">
      <div><div id="ticker" style="color:#556; font-size:12px;">--</div><div id="price" style="font-size:32px; font-weight:bold;">0.00</div></div>
      <div id="change" style="font-size:24px; font-weight:bold;">--</div>
    </div>

    <span class="label">Strategic Portfolio: Multi-Asset Class Analysis</span>
    <table class="strat-table">
      <thead>
        <tr><th>STOCK</th><th>DERIVATIVE</th><th>SOVEREIGN BOND</th><th>ESG/RENEWABLE</th><th>RISK</th></tr>
      </thead>
      <tbody id="portfolio-list"></tbody>
    </table>
  </div>
</aside>

<div id="globe-viz"></div>

<script>
  const sidebar = document.getElementById('sidebar');
  const loader = document.getElementById('loader');
  const ui = document.getElementById('data-ui');

  const globe = Globe()(document.getElementById('globe-viz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#00ffcc').showAtmosphere(true);

  async function fetchMacroData(country) {
    sidebar.classList.add('active');
    ui.style.display = 'none';
    loader.style.display = 'block';
    document.getElementById('country-name').innerText = country;

    try {
      const res = await fetch(`/api/terminal-data?country=${country}`);
      const data = await res.json();

      loader.style.display = 'none';
      ui.style.display = 'block';

      document.getElementById('flag').src = data.flag;
      document.getElementById('news-out').innerHTML = data.news.map(n => `<div class="news-card">${n}</div>`).join('');
      document.getElementById('asset-label').innerText = data.label;
      document.getElementById('ticker').innerText = data.ticker;
      document.getElementById('price').innerText = "$" + data.price;
      
      const change = parseFloat(data.change);
      document.getElementById('change').style.color = change >= 0 ? '#00ff00' : '#ff4444';
      document.getElementById('change').innerText = (change >= 0 ? "▲ " : "▼ ") + Math.abs(change) + "%";

      document.getElementById('portfolio-list').innerHTML = data.portfolio.map(p => `
        <tr>
          <td style="color:var(--neon); font-weight:bold;">${p.stock}</td>
          <td>${p.instrument}</td>
          <td style="color:#aaa">${p.bond}</td>
          <td style="color:#00ffcc">${p.green}</td>
          <td style="font-weight:bold; color:${p.risk==='HIGH'?'#ff4444':'#fff'}">${p.risk}</td>
        </tr>
      `).join('');

    } catch (err) {
      loader.innerText = "UPLINK ERROR: NO SATELLITE COVERAGE";
    }
  }

  fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json()).then(data => {
      globe.polygonsData(data.features)
        .polygonStrokeColor(() => '#00ffcc')
        .polygonCapColor(() => 'rgba(0,255,204,0.02)')
        .onPolygonClick(({ properties: p }) => fetchMacroData(p.ADMIN));
    });
</script>
<style>@keyframes blink { 50% { opacity: 0; } }</style>
</body>
</html>
