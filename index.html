<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GreenYield Macro Terminal | Sanjeev Jha</title>
  
  <script src="https://unpkg.com/globe.gl"></script>
  
  <style>
    :root {
      --terminal-green: #00ffcc;
      --bg-dark: #0a0c10;
      --border-color: #1a1a1a;
    }

    body { 
      margin: 0; 
      background-color: #000; 
      overflow: hidden; 
      font-family: 'Courier New', Courier, monospace; 
    }

    /* TOP COMMAND BAR */
    #header-bar {
      position: absolute; top: 0; width: 100%; height: 45px;
      background: var(--bg-dark); border-bottom: 1px solid var(--terminal-green);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 25px; box-sizing: border-box; z-index: 100;
      color: var(--terminal-green); text-transform: uppercase;
      letter-spacing: 2px; font-size: 14px;
    }

    .status-dot { color: #ff3333; animation: pulse 2s infinite; margin-right: 8px; }
    @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }

    /* BLOOMBERG SIDE TERMINAL */
    #terminal-panel {
      position: absolute; top: 45px; right: -500px; width: 450px; height: calc(100vh - 45px);
      background: rgba(10, 12, 16, 0.98); border-left: 1px solid var(--terminal-green);
      color: var(--terminal-green); z-index: 50; transition: 0.3s ease-out;
      display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    #terminal-panel.active { right: 0; }

    .panel-head { background: var(--terminal-green); color: #000; padding: 12px 20px; font-weight: bold; }
    .panel-body { padding: 25px; overflow-y: auto; }

    .data-label { color: #555; font-size: 11px; margin-top: 25px; border-bottom: 1px solid #222; padding-bottom: 5px; }
    .whisper-output { border-left: 2px solid var(--terminal-green); padding-left: 15px; margin-top: 15px; font-style: italic; font-size: 14px; line-height: 1.6; }
    
    .market-val { font-size: 32px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <header id="header-bar">
    <div><span class="status-dot">●</span>LIVE INTEL: GY-ENGINE</div>
    <div style="font-size: 11px; color: #888;">
      ARCHITECT: <span style="color: var(--terminal-green)">SANJEEV JHA</span> // VER: 2026.05
    </div>
  </header>

  <aside id="terminal-panel">
    <div class="panel-head" id="region-title">REGION SELECT REQUIRED</div>
    <div class="panel-body">
      
      <div class="data-label">INTELLIGENCE WHISPER [GEMINI PRO]</div>
      <div id="whisper-text" class="whisper-output">Awaiting regional uplink...</div>

      <div class="data-label">MARKET PULSE [FINNHUB]</div>
      <div id="market-price" class="market-val">--</div>
      
    </div>
  </aside>

  <div id="globe-main"></div>

  <script>
    const panel = document.getElementById('terminal-panel');
    const globe = Globe()(document.getElementById('globe-main'))
      .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      .backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png');

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.5;

    async function triggerUplink(country) {
      document.getElementById('whisper-text').innerText = "Establishing secure AI channel...";
      
      // VERCEL SECURE CALL
      const res = await fetch(`/api/terminal-data?country=${country}`);
      const data = await res.json();
      
      document.getElementById('whisper-text').innerText = data.whisper;
      document.getElementById('market-price').innerText = `$${data.price}`;
    }

    // Load GeoJSON Data
    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(data => {
        globe.polygonsData(data.features)
          .polygonStrokeColor(() => '#00ffcc')
          .polygonCapColor(() => 'rgba(0,0,0,0.01)')
          .onPolygonClick(({ properties: p }) => {
            document.getElementById('region-title').innerText = `DATASET: ${p.ADMIN}`;
            panel.classList.add('active');
            triggerUplink(p.ADMIN);
          });
      });
  </script>
</body>
</html>
