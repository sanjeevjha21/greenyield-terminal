<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GY-ENGINE | Sanjeev Jha</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #06090d; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: var(--neon); }
    
    /* TOP HEADER */
    #header {
      position: absolute; top: 0; width: 100%; height: 40px; background: #000;
      border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between;
      align-items: center; padding: 0 20px; box-sizing: border-box; z-index: 100;
    }
    .auth { border: 1px solid var(--neon); padding: 2px 8px; font-size: 11px; }

    /* SIDE TERMINAL */
    #panel {
      position: absolute; top: 40px; right: -450px; width: 400px; height: calc(100vh - 40px);
      background: rgba(6, 9, 13, 0.98); border-left: 1px solid var(--neon); z-index: 50;
      transition: 0.5s ease; padding: 25px; box-sizing: border-box;
    }
    #panel.active { right: 0; }
    .label { color: #556; font-size: 10px; text-transform: uppercase; margin-top: 20px; border-bottom: 1px solid #1a1a1a; }
    .data-out { margin-top: 10px; line-height: 1.5; color: #fff; border-left: 2px solid var(--neon); padding-left: 10px; }
  </style>
</head>
<body>

  <div id="header">
    <div style="font-size:11px">● SYSTEM: LIVE_FEED // V2.0</div>
    <div class="auth">ARCHITECT AUTHENTICATED: SANJEEV JHA</div>
  </div>

  <div id="panel">
    <div id="title" style="font-size:18px; font-weight:bold; border-bottom: 2px solid var(--neon);">STANDBY</div>
    <div class="label">AI Whisper</div>
    <div id="whisper" class="data-out">Awaiting uplink...</div>
    <div class="label">Market Pulse</div>
    <div id="market" style="font-size:32px; font-weight:bold; color:var(--neon); margin-top:10px;">--</div>
  </div>

  <div id="globe"></div>

  <script>
    const globeElement = document.getElementById('globe');
    
    const world = Globe()(globeElement)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#00ffcc');

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // DATA FETCHING
    async function updateIntel(country) {
      document.getElementById('whisper').innerText = "Querying Gemini Pro...";
      try {
        const res = await fetch(`/api/terminal-data?country=${country}`);
        const data = await res.json();
        document.getElementById('whisper').innerText = data.whisper || "No signal.";
        document.getElementById('market').innerText = `$${data.price || "0.00"}`;
      } catch (err) {
        document.getElementById('whisper').innerText = "Vercel API connection failed. Check /api folder structure.";
      }
    }

    // LOAD BORDERS - Using a secondary backup link
    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => {
        world.polygonsData(countries.features)
          .polygonStrokeColor(() => '#00ffcc')
          .polygonCapColor(() => 'rgba(0, 255, 204, 0.01)')
          .onPolygonClick(({ properties: p }) => {
            document.getElementById('title').innerText = p.ADMIN.toUpperCase();
            document.getElementById('panel').classList.add('active');
            updateIntel(p.ADMIN);
          });
      })
      .catch(err => console.error("GeoJSON load failed. Check internet connection."));

    window.addEventListener('resize', () => world.width(window.innerWidth).height(window.innerHeight));
  </script>
</body>
</html>
