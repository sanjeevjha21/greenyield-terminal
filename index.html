<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GY-ENGINE // STRATEGIC COMMAND</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    :root { --neon: #00ffcc; --bg: #05070a; --panel: #0d1117; --border: #30363d; --red: #ff4444; }
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
    
    #header { position: absolute; top: 0; width: 100%; height: 50px; background: #000; border-bottom: 1px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; box-sizing: border-box; }
    #sidebar { position: absolute; top: 50px; right: -720px; width: 700px; height: calc(100vh - 50px); background: var(--panel); border-left: 2px solid var(--neon); z-index: 50; transition: 0.4s ease-in-out; overflow-y: auto; padding: 25px; box-sizing: border-box; }
    #sidebar.active { right: 0; box-shadow: -15px 0 50px rgba(0, 255, 204, 0.1); }

    .country-red { color: var(--red); font-weight: bold; font-size: 32px; text-transform: uppercase; border-bottom: 2px solid var(--border); padding-bottom: 10px; display: block; }
    .label { color: #556; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-top: 25px; display: block; border-left: 3px solid var(--neon); padding-left: 10px; }
    
    /* INVESTMENT TABLE */
    .trade-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 12px; }
    .trade-table th { text-align: left; color: #556; padding: 10px; border-bottom: 1px solid var(--border); }
    .trade-table td { padding: 12px 10px; border-bottom: 1px solid #161b22; }
    .risk-high { color: var(--red); font-weight: bold; }
    .risk-low { color: var(--neon); font-weight: bold; }

    .price-box { border: 1px solid var(--neon); padding: 20px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
    .news-card { font-size: 12px; padding: 10px; background: #161b22; margin-top: 8px; border-left: 2px solid var(--border); }
  </style>
</head>
<body>

<header id="header">
  <div style="font-weight: bold; letter-spacing: 2px; color: var(--neon);">GY-ENGINE // STRATEGIC_AI_V3</div>
  <div style="font-size:11px; color:#556;">SYSTEM ARCHITECT: <b style="color:var(--neon)">SANJEEV JHA</b></div>
</header>

<aside id="sidebar">
  <span id="country-out" class="country-red">STANDBY</span>
  
  <div id="loader" style="display:none; color:var(--neon); animation: blink 1s infinite; margin-top:20px;">INTERCEPTING GLOBAL MARKET DATA...</div>

  <div id="data-ui">
    <span class="label">Top 5 Strategic Investment Picks (Stocks/Options/Futures)</span>
    <table class="trade-table">
      <thead>
        <tr><th>#</th><th>ASSET NAME</th><th>INSTRUMENT</th><th>RISK LEVEL</th></tr>
      </thead>
      <tbody id="trade-list"></tbody>
    </table>

    <span class="label">Primary Regional Benchmark</span>
    <div class="price-box">
      <div>
        <div id="ticker-out" style="color:var(--neon); font-weight:bold;">--</div>
        <div id="name-out" style="font-size:11px; color:#556;">--</div>
      </div>
      <div style="text-align:right">
        <div id="price-out" style="font-size:32px; font-weight:bold;">0.00</div>
        <div id="change-out" style="font-weight:bold;">--</div>
      </div>
    </div>

    <span class="label">Top 5 Regional Headlines</span>
    <div id="news-out"></div>
  </div>
</aside>

<div id="globe-viz"></div>

<script>
  const sidebar = document.getElementById('sidebar');
  const loader = document.getElementById('loader');
  const dataUI = document.getElementById('data-ui');

  const globe = Globe()(document.getElementById('globe-viz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#00ffcc').showAtmosphere(true);

  async function updateTerminal(country) {
    sidebar.classList.add('active');
    dataUI.style.display = 'none';
    loader.style.display = 'block';
    document.getElementById('country-out').innerText = country;

    try {
      const res = await fetch(`/api/terminal-data?country=${country}`);
      const data = await res.json();

      loader.style.display = 'none';
      dataUI.style.display = 'block';

      // 1. Fill Trade Table
      document.getElementById('trade-list').innerHTML = data.tradeIdeas.map(t => `
        <tr>
          <td>${t.id}</td>
          <td>${t.asset}</td>
          <td style="color:var(--neon)">${t.instrument}</td>
          <td class="${t.risk === 'HIGH' ? 'risk-high' : 'risk-low'}">${t.risk}</td>
        </tr>
      `).join('');

      // 2. Market Data
      document.getElementById('ticker-out').innerText = data.ticker;
      document.getElementById('name-out').innerText = data.label;
      document.getElementById('price-out').innerText = "$" + data.price;
      const change = parseFloat(data.change);
      document.getElementById('change-out').style.color = change >= 0 ? '#00ff00' : '#ff4444';
      document.getElementById('change-out').innerText = (change >= 0 ? "▲ " : "▼ ") + Math.abs(change) + "%";

      // 3. News
      document.getElementById('news-out').innerHTML = data.news.map(n => `<div class="news-card">${n}</div>`).join('');

    } catch (err) {
      loader.innerText = "UPLINK FAILURE: TIMEOUT";
    }
  }

  fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json()).then(data => {
      globe.polygonsData(data.features)
        .polygonStrokeColor(() => '#00ffcc')
        .polygonCapColor(() => 'rgba(0,255,204,0.02)')
        .onPolygonClick(({ properties: p }) => updateTerminal(p.ADMIN));
    });
</script>
<style>@keyframes blink { 50% { opacity: 0; } }</style>
</body>
</html>
